[package]
name = "translator"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "tror"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-cargo = "0.18.3"
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
