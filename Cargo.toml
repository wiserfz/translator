[package]
name = "translator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tror"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-cargo = "0.18.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
translators = { version = "0.1.5", features = ["google", "tokio-async"] }
